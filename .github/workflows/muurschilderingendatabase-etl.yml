name: 'Muurschilderingendatabase ETL'

env:
  BASE_URI: 'https://muurschilderingendatabase.nl/'
  PROJECT_NAME: 'Muurschilderingendatabase ETL'
  GRAPH_ID: 'muurschilderingen'
  ARTIFACT_PATH: 'artifact-data.ttl'
  PYTHON_VERSION: '3.12'

on:
  schedule:
  - cron: '0 0 * * 0'
    timezone: 'Europe/Amsterdam'
  workflow_dispatch: {}

# Standaard alleen leesrechten; de keepalive-job vraagt zelf meer aan.
permissions:
  contents: read

# Nooit twee runs tegelijk naar dezelfde graph laten schrijven.
concurrency:
  group: muurschilderingendatabase-etl
  cancel-in-progress: false

jobs:
  # GitHub schakelt geplande workflows in publieke repositories uit na 60 dagen
  # zonder repository-activiteit. Het opnieuw 'enablen' van de workflow via de
  # API zet die teller terug, zonder dat er dummy-commits nodig zijn.
  # Bewust een losse job zonder 'needs': ook als de ETL zelf faalt blijft het
  # schema actief.
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
    - name: Reset 60 dagen inactiviteitsteller
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh api --method PUT \
          "repos/${{ github.repository }}/actions/workflows/muurschilderingendatabase-etl.yml/enable"

  get-latest-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'  # Caching voor snellere runs
    - run: pip install -r requirements.txt --upgrade-strategy eager
    - name: Get latest data from Muurschilderingendatabase
      run: python src/export_from_omeka_s.py
      env:
        BASE_URI: ${{ env.BASE_URI }}
        PROJECT_NAME: ${{ env.PROJECT_NAME }}
        TARGET_FILEPATH: ${{ env.ARTIFACT_PATH }}
        GRAPH_ID: ${{ env.GRAPH_ID }}
    - name: Upload data artifact
      uses: actions/upload-artifact@v7
      with:
        name: data-artifact
        path: ${{ env.ARTIFACT_PATH }}
        overwrite: true
        retention-days: 1
        if-no-files-found: error

  filter-transform-enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: get-latest-data
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
    - run: pip install -r requirements.txt --upgrade-strategy eager
    - name: Download data artifact
      uses: actions/download-artifact@v8
      with:
        name: data-artifact
    - name: Transform and enrich data
      run:  python src/transform_datamodel.py
      env:
        FILTER_O_ISPUBLIC: http://omeka.org/s/vocabs/o#is_public
        FILTER_O_RESOURCECLASS: http://omeka.org/s/vocabs/o#resource_class
        FILTER_O_RESOURCE_TEMPLATE: http://omeka.org/s/vocabs/o#resource_template
        BASE_URI: ${{ env.BASE_URI }}
        PROJECT_NAME: ${{ env.PROJECT_NAME }}
        TARGET_FILEPATH: ${{ env.ARTIFACT_PATH }}
        GRAPH_ID: ${{ env.GRAPH_ID }}
    - name: Upload data artifact
      uses: actions/upload-artifact@v7
      with:
        name: data-artifact
        path: ${{ env.ARTIFACT_PATH }}
        overwrite: true
        retention-days: 1
        if-no-files-found: error

  push-to-triply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [get-latest-data, filter-transform-enrich]
    steps:
    - name: Download data artifact
      uses: actions/download-artifact@v8
      with:
          name: data-artifact
    - name: Install dependencies
      run: |
        wget --tries=3 'https://static.triply.cc/cli/triplydb-linux'
        chmod +x triplydb-linux
    - name: Push changes to TriplyDB API via CLI
      env:
        # Token via de omgeving in plaats van rechtstreeks in de opdrachtregel.
        LDV_API_TOKEN: ${{ secrets.LDV_API_TOKEN }}
      run: |
        ./triplydb-linux import-from-file --dataset "Muurschilderingen" --token "$LDV_API_TOKEN" --account "rce" --url "https://api.linkeddata.cultureelerfgoed.nl" --default-graph-name "https://linkeddata.cultureelerfgoed.nl/rce/Muurschilderingen/graphs/${{ env.GRAPH_ID }}" --mode "overwrite" ${{ env.ARTIFACT_PATH }}
    - name: Print triply error response
      if: ${{ failure() }}
      run: |
        cat .triplydb-js.err || true
